<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天气 WeatherApp</title>
<style>
  :root {
    --bg1: #1e3c72;
    --bg2: #2a5298;
    --card: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --sub: rgba(255, 255, 255, 0.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    padding: 20px 18px 32px;
    transition: background 0.6s ease;
  }
  .topbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .topbar input {
    flex: 1; border: none; outline: none; border-radius: 12px;
    padding: 10px 12px; font-size: 15px; background: var(--card); color: var(--text);
  }
  .topbar input::placeholder { color: var(--sub); }
  .topbar button {
    border: none; border-radius: 12px; padding: 10px 14px; font-size: 15px;
    background: rgba(255,255,255,0.22); color: #fff; cursor: pointer;
  }
  .loc { font-size: 22px; font-weight: 600; }
  .loc small { font-size: 13px; color: var(--sub); font-weight: 400; display: block; margin-top: 2px; }
  .now { text-align: center; margin: 14px 0 6px; }
  .now .icon { font-size: 76px; line-height: 1; }
  .now .temp { font-size: 72px; font-weight: 200; margin: 0; }
  .now .desc { font-size: 18px; color: var(--sub); }
  .now .feel { font-size: 14px; color: var(--sub); margin-top: 4px; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0;
  }
  .cell {
    background: var(--card); border-radius: 14px; padding: 12px 8px; text-align: center;
  }
  .cell .v { font-size: 18px; font-weight: 600; }
  .cell .k { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .section-title { font-size: 14px; color: var(--sub); margin: 16px 2px 8px; }
  .hourly { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .hourly .h {
    flex: 0 0 auto; background: var(--card); border-radius: 14px;
    padding: 10px 12px; text-align: center; min-width: 62px;
  }
  .hourly .h .t { font-size: 12px; color: var(--sub); }
  .hourly .h .i { font-size: 26px; margin: 4px 0; }
  .hourly .h .temp { font-size: 15px; font-weight: 600; }
  .daily .d {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px;
  }
  .daily .d .day { font-size: 15px; width: 64px; }
  .daily .d .i { font-size: 26px; }
  .daily .d .range { font-size: 15px; font-weight: 600; }
  .daily .d .range small { color: var(--sub); font-weight: 400; margin-left: 6px; }
  .status { text-align: center; color: var(--sub); font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="topbar">
    <input id="cityInput" type="text" placeholder="搜索城市，如 上海 / Tokyo" />
    <button id="searchBtn">搜索</button>
    <button id="locBtn">定位</button>
  </div>

  <div class="loc" id="locName">加载中…<small id="locSub">正在获取天气</small></div>

  <div class="now">
    <div class="icon" id="nowIcon">⛅</div>
    <p class="temp" id="nowTemp">--°</p>
    <div class="desc" id="nowDesc">--</div>
    <div class="feel" id="nowFeel"></div>
  </div>

  <div class="grid">
    <div class="cell"><div class="v" id="mHum">--</div><div class="k">湿度</div></div>
    <div class="cell"><div class="v" id="mWind">--</div><div class="k">风速</div></div>
    <div class="cell"><div class="v" id="mPres">--</div><div class="k">气压</div></div>
  </div>

  <div class="section-title">未来 12 小时</div>
  <div class="hourly" id="hourly"></div>

  <div class="section-title">未来 5 天</div>
  <div class="daily" id="daily"></div>

  <div class="status" id="status"></div>

<script>
  const WMO = {
    0: ["晴", "☀️"], 1: ["大致晴朗", "🌤️"], 2: ["局部多云", "⛅"], 3: ["阴", "☁️"],
    45: ["雾", "🌫️"], 48: ["雾凇", "🌫️"],
    51: ["小毛毛雨", "🌦️"], 53: ["毛毛雨", "🌦️"], 55: ["大毛毛雨", "🌦️"],
    56: ["冻毛毛雨", "🌧️"], 57: ["冻毛毛雨", "🌧️"],
    61: ["小雨", "🌧️"], 63: ["中雨", "🌧️"], 65: ["大雨", "🌧️"],
    66: ["冻雨", "🌧️"], 67: ["冻雨", "🌧️"],
    71: ["小雪", "🌨️"], 73: ["中雪", "🌨️"], 75: ["大雪", "❄️"],
    77: ["雪粒", "🌨️"], 80: ["阵雨", "🌦️"], 81: ["阵雨", "🌦️"], 82: ["强阵雨", "⛈️"],
    85: ["阵雪", "🌨️"], 86: ["强阵雪", "❄️"],
    95: ["雷阵雨", "⛈️"], 96: ["雷阵雨伴雹", "⛈️"], 99: ["强雷暴伴雹", "⛈️"]
  };
  function wmo(code){ return WMO[code] || ["未知", "🌡️"]; }
  function setBg(isDay){
    const b = document.documentElement.style;
    if (isDay){
      b.setProperty('--bg1', '#1e3c72'); b.setProperty('--bg2', '#2a5298');
    } else {
      b.setProperty('--bg1', '#0f2027'); b.setProperty('--bg2', '#203a43');
    }
  }
  function fmtHour(t){
    const d = new Date(t);
    return d.getHours() + ":00";
  }
  function fmtDay(t){
    const d = new Date(t);
    const w = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
    return (d.getMonth()+1) + "/" + d.getDate() + " " + w;
  }

  async function loadWeather(lat, lon, name, sub){
    document.getElementById("status").textContent = "正在获取天气数据…";
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure,is_day`
        + `&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min`
        + `&timezone=auto&forecast_days=6`;
      const r = await fetch(url);
      const j = await r.json();
      const c = j.current;
      const [desc, icon] = wmo(c.weather_code);
      setBg(c.is_day === 1);
      document.getElementById("locName").innerHTML = `${name}<small>${sub || ""}</small>`;
      document.getElementById("nowIcon").textContent = icon;
      document.getElementById("nowTemp").textContent = Math.round(c.temperature_2m) + "°";
      document.getElementById("nowDesc").textContent = desc;
      document.getElementById("nowFeel").textContent = "体感 " + Math.round(c.apparent_temperature) + "°";
      document.getElementById("mHum").textContent = c.relative_humidity_2m + "%";
      document.getElementById("mWind").textContent = Math.round(c.wind_speed_10m) + " km/h";
      document.getElementById("mPres").textContent = Math.round(c.surface_pressure) + " hPa";

      // hourly (next 12 entries from current hour)
      const hBox = document.getElementById("hourly");
      hBox.innerHTML = "";
      const nowHour = new Date().getHours();
      let count = 0;
      for (let i = 0; i < j.hourly.time.length && count < 12; i++){
        const dh = new Date(j.hourly.time[i]).getHours();
        if (i > 0 && dh < nowHour) continue;
        const [, hi] = wmo(j.hourly.weather_code[i]);
        const div = document.createElement("div");
        div.className = "h";
        div.innerHTML = `<div class="t">${fmtHour(j.hourly.time[i])}</div>`
          + `<div class="i">${hi}</div>`
          + `<div class="temp">${Math.round(j.hourly.temperature_2m[i])}°</div>`;
        hBox.appendChild(div);
        count++;
      }

      // daily
      const dBox = document.getElementById("daily");
      dBox.innerHTML = "";
      for (let i = 0; i < j.daily.time.length; i++){
        const [, di] = wmo(j.daily.weather_code[i]);
        const div = document.createElement("div");
        div.className = "d";
        div.innerHTML = `<div class="day">${fmtDay(j.daily.time[i])}</div>`
          + `<div class="i">${di}</div>`
          + `<div class="range">${Math.round(j.daily.temperature_2m_max[i])}°`
          + `<small>${Math.round(j.daily.temperature_2m_min[i])}°</small></div>`;
        dBox.appendChild(div);
      }
      document.getElementById("status").textContent = "数据更新于 " + new Date().toLocaleString("zh-CN");
    } catch (e) {
      document.getElementById("status").textContent = "获取失败：" + e.message + "（可重试或换城市）";
    }
  }

  async function searchCity(q){
    document.getElementById("status").textContent = "搜索城市…";
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=zh&format=json`);
      const j = await r.json();
      if (!j.results || !j.results.length){ document.getElementById("status").textContent = "未找到该城市"; return; }
      const g = j.results[0];
      const nm = g.name + (g.admin1 ? "，" + g.admin1 : "") + (g.country ? "，" + g.country : "");
      loadWeather(g.latitude, g.longitude, g.name, g.country);
    } catch (e) {
      document.getElementById("status").textContent = "搜索失败：" + e.message;
    }
  }

  // 默认城市：想换默认城市只改这里三行即可
  const DEFAULT_CITY = { name: "北京", lat: 39.9042, lon: 116.4074, sub: "默认城市" };

  async function getPosition(){
    // 优先用 Capacitor 原生定位（iOS 上能正确弹出系统权限框）
    try {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation){
        const p = await window.Capacitor.Plugins.Geolocation.getCurrentPosition({ enableHighAccuracy: true, timeout: 10000 });
        return { lat: p.coords.latitude, lon: p.coords.longitude };
      }
    } catch(e){ console.warn("Capacitor 定位失败，回退浏览器定位", e); }
    // 回退：浏览器原生定位
    return await new Promise(resolve => {
      if (!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  }

  async function autoLocate(){
    document.getElementById("status").textContent = "正在定位…";
    const pos = await getPosition();
    if (pos){
      loadWeather(pos.lat, pos.lon, "当前位置", "GPS 定位");
    } else {
      document.getElementById("status").textContent = "定位不可用，已使用默认城市";
      loadWeather(DEFAULT_CITY.lat, DEFAULT_CITY.lon, DEFAULT_CITY.name, DEFAULT_CITY.sub);
    }
  }

  document.getElementById("searchBtn").onclick = () => {
    const q = document.getElementById("cityInput").value.trim();
    if (q) searchCity(q);
  };
  document.getElementById("cityInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("searchBtn").click();
  });
  document.getElementById("locBtn").onclick = autoLocate;

  // 启动：先自动定位，失败则回退默认城市
  autoLocate();
</script>
</body>
</html>
