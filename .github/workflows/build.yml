name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Ionic & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 @capacitor/geolocation@7
          npx cap init WeatherApp com.weather.app --web-dir www
          npx cap add ios || true

      - name: Fix iOS Deployment Target
        run: |
          cd ios/App
          sed -i '' 's/platform :ios, .*/platform :ios, "16.0"/' Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' App.xcodeproj/project.pbxproj

      - name: Build Web App & Sync
        run: |
          npx cap copy ios
          npx cap update ios

      - name: Add Location Permission
        run: |
          cd ios/App
          python3 - <<'PY'
          p = 'App/App/Info.plist'
          s = open(p).read().replace('\r\n', '\n')
          key = '<key>NSLocationWhenInUseUsageDescription</key>\n<string>需要定位权限以显示您所在位置的天气</string>\n'
          if 'NSLocationWhenInUseUsageDescription' not in s:
              s = s.replace('</dict>\n</plist>', key + '</dict>\n</plist>', 1)
              open(p, 'w').write(s)
          PY

      - name: Build Unsigned App
        run: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build

      - name: Package to IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r WeatherApp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-IPA
          path: WeatherApp-unsigned.ipa
